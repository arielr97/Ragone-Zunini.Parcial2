<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Mi Tienda</title>
</head>

<body>
    <nav>
        <div class="nav-content">
            <img src="img/logo.png" alt="Mi Tienda">
            <h1>Mi Tienda</h1>
            <p>Ariel Ragone | Matias Zunini</p>

            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="carrito.html">Carrito</a>
        </div>
    </nav>

    <main>
        <div class="toolbar-filtros">
            <select id="filtro-tipo">
                <option value="">Todos</option>
                <option value="Libro">Libros</option>
                <option value="CD">CDs</option>
            </select>

            <select id="orden-precio">
                <option value="">Sin ordenar</option>
                <option value="asc">Precio menor a mayor</option>
                <option value="desc">Precio mayor a menor</option>
            </select>
            <input type="text" id="busqueda" placeholder="Buscar producto...">
            <button id="btn-buscar">Buscar</button>
            <button id="limpiar-busqueda">Limpiar búsqueda</button>

        </div>
        <div id="contenedor-productos"></div>
        <div id="paginacion">
            <button id="anterior">Anterior</button>
            <button id="siguiente">Siguiente</button>
            <button onclick="window.location.href='carrito.html'">Ir al carrito</button>
        </div>
    </main>
    <script src="/js/productos.js"></script>
</body>
</html>
